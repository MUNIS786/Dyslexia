name: DyslexAid V2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-24.04

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run Backend Regression Test Suite
        env:
          ENV: test
          LOG_LEVEL: INFO
          JWT_SECRET: ci-test-secret-never-used-in-production-32chars
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: dyslexaid_test
          CHAT_OFFLINE_MODE: "true"
        run: |
          python -m pytest backend/ -v --tb=short

  frontend-quality:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Vite Production Build
        working-directory: frontend
        run: npm run build
