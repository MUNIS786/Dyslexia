# ==============================================================================
# DyslexAid V2 — Production Nginx Reverse Proxy Configuration Template
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging with X-Request-ID and response latency
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time req_id="$http_x_request_id"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression for frontend assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream FastAPI backend
    upstream backend_cluster {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name app.dyslexaid.org;

        # Redirect all HTTP traffic to HTTPS in production
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name app.dyslexaid.org;

        # TLS Certificates (managed via Let's Encrypt / Certbot)
        ssl_certificate /etc/letsencrypt/live/app.dyslexaid.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.dyslexaid.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; connect-src 'self' ws: wss:; img-src 'self' data:;" always;

        # Client Body Restrictions
        client_max_body_size 16M;

        # 1. API Reverse Proxy
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # 2. SSE Notifications Stream (Streaming proxy settings)
        location /api/notifications/stream {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # 3. Static Single Page Application (SPA) Frontend
        location / {
            root /var/www/dyslexaid/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.(?:css|js|woff2?|svg|png|jpg|ico)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
